[package]
name = "code_graph"
version = "0.1.0"
edition = "2024"

[lib]
name = "code_graph"
path = "src/lib.rs"

[[bin]]
name = "codegraph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
# bundled 會編入 SQLite 並啟用 FTS5，確保各平台行為一致，也不依賴系統
# 上是否安裝 libsqlite3。
rusqlite = { version = "0.40", features = ["bundled"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24.2"
